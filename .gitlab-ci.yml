stages:
  - test

ui-tests:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.63.0-noble
  script:
    - cd Automation-Testing/py-plw-pet
    - pip install -r requirements.txt
    - pytest --alluredir=allure-results --junitxml=report.xml
  artifacts:
    when: always
    paths:
      - Automation-Testing/py-plw-pet/allure-results/
    reports:
      junit: Automation-Testing/py-plw-pet/report.xml