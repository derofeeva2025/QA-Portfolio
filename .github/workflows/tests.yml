name: Tests and Allure report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation-Testing/py-plw-pet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Automation-Testing/py-plw-pet/requirements.txt

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest --alluredir=allure-results
        continue-on-error: true   

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Build report
        run: allure generate allure-results -o allure-report --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Automation-Testing/py-plw-pet/allure-report

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
